<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local BGG Wishlist Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Local Wishlist Finder</h1>
    </header>
    <main>
        <section class="search-section">
            <div class="input-group">
                <label for="username">BGG Username:</label>
                <input type="text" id="username" placeholder="e.g. jsmith" required>
            </div>
            <div class="input-group">
                <label for="country">Country/Geography:</label>
                <input type="text" id="country" placeholder="e.g. Australia" required>
            </div>
            <button id="search-btn">Search</button>
        </section>

        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Fetching wishlist...</p>
        </div>

        <section id="results-section">
            <h2>Results</h2>
            <div id="results-grid" class="grid"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
